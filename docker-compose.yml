services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mypod
      POSTGRES_PASSWORD: mypod_password
      POSTGRES_DB: mypod_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypod -d mypod_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://mypod:mypod_password@postgres:5432/mypod_pipeline
      PORT: 3000
      LOG_LEVEL: info
      RUST_LOG: info
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./ingest-pipeline", "all"]

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    profiles:
      - tools
    depends_on:
      - postgres

volumes:
  postgres_data:
