[package]
name = "ingest-pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "http2", "gzip", "brotli"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
regex = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
httpmock = "0.7"
tokio-test = "0.4"

[[bench]]
name = "bench_insert"
harness = false

[[bench]]
name = "bench_dedup"
harness = false

[[bench]]
name = "bench_extract"
harness = false

[[bench]]
name = "bench_ingest"
harness = false
